name: Generator feature
about: Propose one reviewable OpenAPI-to-VBA generator change
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What OpenAPI/VBA behavior is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed PR scope
      description: Keep this to one feature or tightly related group.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include fixture/test/generated-code expectations.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Explicitly out of scope
    validations:
      required: true
