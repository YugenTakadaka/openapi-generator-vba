name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build generator
        run: mvn --batch-mode --no-transfer-progress package -DskipTests
      - name: Smoke-generate fixture
        shell: bash
        run: |
          chmod +x scripts/generate-example.sh
          ./scripts/generate-example.sh examples/fixtures/minimal.yaml target/generated-smoke
      - name: Show generated files
        if: always()
        run: find target/generated-smoke -type f -maxdepth 5 -print 2>/dev/null || true
