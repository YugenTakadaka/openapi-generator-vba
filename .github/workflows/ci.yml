name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Generate minimal fixture when generator JAR exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x scripts/generate-example.sh ]]; then
            scripts/generate-example.sh
          else
            echo "generate-example.sh is not executable; running with bash"
            bash scripts/generate-example.sh
          fi
